[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "uvicorn[standard]>=0.32.0",
    "fastapi>=0.135.1",
    "httpx>=0.28.1",
    "mcp-swagger-ui>=0.1.1",
    "mcp[cli]>=1.26.0",
    "python-dotenv>=1.0.1",
    "requests>=2.32.5",
    "deepagents>=0.4.12",
    "langchain-openai>=1.1.11",
    "streamlit>=1.56.0",
]

[project.scripts]
goog = "tutorials.deep_agents_simple.cli:main"

[build-system]
requires = ["hatchling>=1.26.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tutorials"]

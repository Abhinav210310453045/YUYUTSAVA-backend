[project]
name = "yuyutsava"
version = "0.1.0"
description = "YUYUTSAVA — an AI agent that executes natural language tasks"
requires-python = ">=3.11"
dependencies = [
    "uvicorn[standard]>=0.32.0",
    "fastapi>=0.135.1",
    "httpx>=0.28.1",
    "mcp-swagger-ui>=0.1.1",
    "mcp[cli]>=1.26.0",
    "python-dotenv>=1.0.1",
    "requests>=2.32.5",
    "deepagents>=0.6.3",
    "langgraph-cli[inmem]>=0.4.27",
    "langchain-openai>=1.1.11",
    "streamlit>=1.56.0",
    "watchdog>=4.0.0",
    "python-ulid>=2.7.0",
    "pyyaml>=6.0.0",
    "sse-starlette>=2.0.0",
    "tavily-python>=0.5.0",
    "exa-py>=1.1.0",
    "langgraph-checkpoint-sqlite>=3.0.3",
    "pyperclip>=1.11.0",
    "pynput>=1.8.1",
    "pyobjc-framework-cocoa>=12.1 ; sys_platform == 'darwin'",
    "portalocker>=2.10",
    "langfuse>=4",
    "aiosqlite>=0.20.0",
    "sqlglot>=25.0.0",
    "prompt-toolkit>=3.0",
    "langgraph-checkpoint-postgres>=2.0.0",
    "psycopg[binary,pool]>=3.2",
    "psutil>=5.9",
]

[project.optional-dependencies]
deepface = [
    "deepface>=0.0.93",
    "tf-keras>=2.15.0",
]
vision = [
    "opencv-python>=4.10.0",
    "numpy>=1.26.0",
]
voice = [
    "sounddevice>=0.4.6",
    "soundfile>=0.12.1",
    "numpy>=1.26.0",
    "openwakeword>=0.6.0",
    # openwakeword 0.6.0's pretrained ONNX models silently produce garbage
    # classifier scores (~0.0 for everything, no error) under onnxruntime >=1.20
    # — wake-word detection never fires. 1.19.x is the last working line; pin
    # below 1.20 until openwakeword ships models compatible with newer runtimes.
    # faster-whisper accepts onnxruntime>=1.14,<2 so this satisfies both.
    "onnxruntime>=1.16,<1.20",
    "faster-whisper>=1.0.0",
    # Maintained fork with prebuilt wheels; the original `webrtcvad` does
    # `import pkg_resources` at import time, which setuptools>=81 no longer
    # provides — so it silently failed and the VAD fell back to a noisy
    # energy gate that transcribed ambient sound nonstop.
    "webrtcvad-wheels>=2.0.14",
    # Zero-config TTS fallback off-macOS (SAPI5 on Windows, espeak on Linux);
    # macOS keeps the built-in `say` fallback instead.
    "pyttsx3>=2.90 ; sys_platform != 'darwin'",
]
memory = [
    "pgvector>=0.3.0",
]
visuals = [
    # Delivery-agnostic rendering library (yuyutsava/visuals/). Charts, styled
    # tables, math and code images all render in-process; diagrams go out to a
    # Kroki HTTP service (no extra dep — uses the base `requests`).
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "pandas>=2.0.0",
    "pygments>=2.17.0",
    "pillow>=10.0.0",
]
# ── LLM provider SDKs ────────────────────────────────────────────────────────
# Each is lazily imported in yuyutsava/core/llm.py; install only the ones you use
# (or `all-providers` for everything). Floors target the langchain-core 1.x line.
# Azure OpenAI needs no extra — AzureChatOpenAI ships with langchain-openai.
anthropic = ["langchain-anthropic>=1.4"]
google = ["langchain-google-genai>=4.2"]
vertex = ["langchain-google-vertexai>=3.2"]
bedrock = ["langchain-aws>=1.6"]
mistral = ["langchain-mistralai>=1.1"]
cohere = ["langchain-cohere>=0.6"]
all-providers = [
    "langchain-anthropic>=1.4",
    "langchain-google-genai>=4.2",
    "langchain-google-vertexai>=3.2",
    "langchain-aws>=1.6",
    "langchain-mistralai>=1.1",
    "langchain-cohere>=0.6",
]

[project.scripts]
yuyutsava = "yuyutsava.cli.cli:main"

[build-system]
requires = ["hatchling>=1.26.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["yuyutsava"]

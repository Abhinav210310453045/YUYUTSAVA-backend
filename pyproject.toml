[project]
name = "yuyutsava"
version = "0.1.0"
description = "YUYUTSAVA — an AI agent that executes natural language tasks"
requires-python = ">=3.11"
dependencies = [
    "uvicorn[standard]>=0.32.0",
    "fastapi>=0.135.1",
    "httpx>=0.28.1",
    "mcp-swagger-ui>=0.1.1",
    "mcp[cli]>=1.26.0",
    "python-dotenv>=1.0.1",
    "requests>=2.32.5",
    "deepagents>=0.4.12",
    "langchain-openai>=1.1.11",
    "streamlit>=1.56.0",
    "watchdog>=4.0.0",
    "python-ulid>=2.7.0",
    "pyyaml>=6.0.0",
    "sse-starlette>=2.0.0",
    "tavily-python>=0.5.0",
    "exa-py>=1.1.0",
]

[project.scripts]
yuyutsava = "yuyutsava.cli.cli:main"

[build-system]
requires = ["hatchling>=1.26.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["yuyutsava"]

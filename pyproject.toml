[project]
name = "yuyutsava"
version = "0.1.0"
description = "A local-first AI agent runtime: one-shot CLI and a long-running daemon with a desktop app"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Abhinav" }]
keywords = ["ai", "agent", "llm", "langgraph", "mcp", "daemon", "assistant"]
classifiers = [
    # No "License ::" classifier here on purpose: PEP 639 deprecates them once
    # `license` carries an SPDX expression, and some backends now error on both.
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]

dependencies = [
    "uvicorn[standard]>=0.32.0",
    "fastapi>=0.135.1",
    "httpx>=0.28.1",
    "mcp[cli]>=1.26.0",
    "python-dotenv>=1.0.1",
    "requests>=2.32.5",
    # --- Agent framework -------------------------------------------------
    # Upper bounds are deliberate. This codebase couples to framework
    # internals (see docs/architecture/review/04-findings-thirdparty-coupling.md),
    # and some of those couplings fail SILENTLY on upgrade. Do not relax a
    # ceiling without running test/framework_contract/.
    #
    # deepagents <0.7: the known 0.7 blocker is now CLEARED — all four build
    # paths pass BackendProtocol instances rather than the callable factories
    # 0.7.0 removes (see _local_shell_backend in core/engine.py, and the
    # regression guard test_no_build_path_passes_a_backend_factory).
    # The ceiling stays because 0.7 is unreleased and therefore untested against
    # the other three internal couplings in test/framework_contract/. Lift to
    # <0.8 once 0.7 ships and `python scripts/verify_framework_contract.py`
    # passes against it — that run is the whole acceptance criterion.
    "deepagents>=0.6.3,<0.7",
    "langgraph-cli[inmem]>=0.4.27,<0.5",
    "langchain-openai>=1.1.11,<2",
    # Imported directly by ~64 modules but previously undeclared — they arrived
    # transitively through deepagents. Depend on what you import: a transitive
    # bump (or deepagents dropping one) would otherwise break us with no
    # constraint of our own to catch it.
    "langchain>=1.3,<2",
    "langchain-core>=1.4,<2",
    "langgraph>=1.2,<2",
    "watchdog>=4.0.0",
    "python-ulid>=2.7.0",
    "pyyaml>=6.0.0",
    "sse-starlette>=2.0.0",
    "tavily-python>=0.5.0",
    "exa-py>=1.1.0",
    "langgraph-checkpoint-sqlite>=3.0.3,<4",
    "pyperclip>=1.11.0",
    "pynput>=1.8.1",
    "pyobjc-framework-cocoa>=12.1 ; sys_platform == 'darwin'",
    "portalocker>=2.10",
    "langfuse>=4",
    "aiosqlite>=0.20.0",
    "sqlglot>=25.0.0",
    "prompt-toolkit>=3.0",
    "rich>=14",
    # Floor kept at the original 2.0.0 (not raised to the resolved 3.1.0) so
    # existing pins keep working; ceiling widened to <4 because 3.x is what is
    # actually installed and exercised.
    "langgraph-checkpoint-postgres>=2.0.0,<4",
    "psycopg[binary,pool]>=3.2",
    "psutil>=5.9",
]

[project.urls]
Homepage = "https://github.com/Abhinav210310453045/YUYUTSAVA-backend"
Repository = "https://github.com/Abhinav210310453045/YUYUTSAVA-backend"
Issues = "https://github.com/Abhinav210310453045/YUYUTSAVA-backend/issues"

[project.optional-dependencies]
# Moved out of the base dependencies: streamlit pulls pydeck/altair/tornado/
# gitpython and is not imported anywhere in the tree. Install with
# `uv sync --extra streamlit` if a Streamlit UI is ever wired up.
streamlit = [
    "streamlit>=1.56.0",
]
vision = [
    "opencv-python>=4.10.0",
    "numpy>=1.26.0",
]
voice = [
    "sounddevice>=0.4.6",
    "soundfile>=0.12.1",
    "numpy>=1.26.0",
    "openwakeword>=0.6.0",
    # openwakeword 0.6.0's pretrained ONNX models silently produce garbage
    # classifier scores (~0.0 for everything, no error) under onnxruntime >=1.20
    # — wake-word detection never fires. 1.19.x is the last working line; pin
    # below 1.20 until openwakeword ships models compatible with newer runtimes.
    # faster-whisper accepts onnxruntime>=1.14,<2 so this satisfies both.
    "onnxruntime>=1.16,<1.20",
    "faster-whisper>=1.0.0",
    # Maintained fork with prebuilt wheels; the original `webrtcvad` does
    # `import pkg_resources` at import time, which setuptools>=81 no longer
    # provides — so it silently failed and the VAD fell back to a noisy
    # energy gate that transcribed ambient sound nonstop.
    "webrtcvad-wheels>=2.0.14",
    # Zero-config TTS fallback off-macOS (SAPI5 on Windows, espeak on Linux);
    # macOS keeps the built-in `say` fallback instead.
    "pyttsx3>=2.90 ; sys_platform != 'darwin'",
    # pyttsx3's SAPI5 driver drives Windows TTS through COM — declare the COM
    # deps explicitly so a clean Windows install has a working voice fallback
    # (pyttsx3 imports these lazily and doesn't hard-require them itself).
    "comtypes>=1.2.0 ; sys_platform == 'win32'",
    "pywin32>=306 ; sys_platform == 'win32'",
]
memory = [
    "pgvector>=0.3.0",
]
visuals = [
    # Delivery-agnostic rendering library (yuyutsava/visuals/). Charts, styled
    # tables, math and code images all render in-process; diagrams go out to a
    # Kroki HTTP service (no extra dep — uses the base `requests`).
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "pandas>=2.0.0",
    "pygments>=2.17.0",
    "pillow>=10.0.0",
]
# ── LLM provider SDKs ────────────────────────────────────────────────────────
# Each is lazily imported by its provider module in yuyutsava/llm/providers/
# (via yuyutsava.llm.base.require); install only the ones you use, or
# `all-providers` for everything. Floors target the langchain-core 1.x line;
# ceilings match the base deps — every one of these returns a BaseChatModel we
# hand straight to the framework, so a major bump is a framework-compat event.
# Azure OpenAI needs no extra — AzureChatOpenAI ships with langchain-openai.
anthropic = ["langchain-anthropic>=1.4,<2"]
google = ["langchain-google-genai>=4.2,<5"]
vertex = ["langchain-google-vertexai>=3.2,<4"]
bedrock = ["langchain-aws>=1.6,<2"]
mistral = ["langchain-mistralai>=1.1,<2"]
cohere = ["langchain-cohere>=0.6,<1"]
all-providers = [
    "langchain-anthropic>=1.4,<2",
    "langchain-google-genai>=4.2,<5",
    "langchain-google-vertexai>=3.2,<4",
    "langchain-aws>=1.6,<2",
    "langchain-mistralai>=1.1,<2",
    "langchain-cohere>=0.6,<1",
]
# The test runner. Most of the suite is `unittest` and runs without it, but five
# files are written as bare pytest functions — `unittest` discovers nothing in
# them and reports OK, so 17 tests silently never ran. pytest collects both
# styles. Install with `uv pip install -e '.[dev]'` (W6 makes it the runner of
# record and adds markers).
dev = [
    "pytest>=8.0",
]

[project.scripts]
yuyutsava = "yuyutsava.cli.cli:main"

[build-system]
# >=1.27 for PEP 639: the SPDX `license` string and the `license-files` array
# in [project] are both silently dropped by older hatchling.
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["yuyutsava"]

# ── Lint ─────────────────────────────────────────────────────────────────────
# Rules and their reasons: docs/code-review/v0.1.0/01-standards.md.
[tool.ruff]
# Pinned so a local run, the ratchet script and CI see the same findings.
required-version = "==0.16.5"
target-version = "py311"
# 100 is where the existing code already sits: only 0.22% of lines are longer,
# and it reformats the fewest files of 88, 100 and 120.
line-length = 100

[tool.ruff.lint]
# The gate — CI fails on any of these. They find real defects (names that do not
# exist, dead exports, unused locals and imports, a re-raise that drops its cause
# — B904) or break the import-placement standard, which includes sorted import
# blocks (I001).
select = ["B904", "E402", "E741", "F401", "F541", "F821", "F822", "F841", "I001"]
# Rules with too many existing violations to gate at zero (PLC0415, C901,
# PLR0913, BLE001, S110, T201) are not selected here: scripts/check_lint_ratchet.py
# counts them per file against scripts/lint_ratchet.json, and no count may grow.

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.pylint]
max-args = 7

[tool.ruff.lint.per-file-ignores]
# print is how the terminal front end and maintainer scripts talk to people.
"yuyutsava/cli/**" = ["T201"]
"scripts/**" = ["T201"]
# Tests defer heavy imports into test bodies to keep collection fast.
"test/**" = ["PLC0415", "T201"]
# Imports that follow sys.path manipulation — removed with it (R-TST-02, W6).
"test/async_subagents/test_completion_loop.py" = ["E402"]
"test/async_subagents/test_unit.py" = ["E402"]
"test/consent/test_registry.py" = ["E402"]
"test/test_ask_handler.py" = ["E402"]
"test/test_async.py" = ["E402"]
"test/test_fetch_verify.py" = ["E402"]

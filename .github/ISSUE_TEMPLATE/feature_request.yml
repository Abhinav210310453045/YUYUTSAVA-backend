name: Feature request
description: Suggest a capability or change
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        This is a single-maintainer alpha project. The most persuasive requests
        explain a concrete problem you hit, not just a capability you want.

  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do that is currently hard or impossible?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What you have in mind
      description: Roughly how it might work. A sketch is fine.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: What you tried instead
      description: Workarounds, or why the existing tools do not cover it.

  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options:
        - CLI
        - Daemon
        - Desktop app
        - Voice
        - TODO board
        - Memory / retrieval
        - MCP
        - LLM providers
        - Storage
        - Tools / task runner
        - Visuals
        - Docs
        - Other
    validations:
      required: true

  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution
      options:
        - label: I would be willing to open a PR for this

name: Bug report
description: Something behaves incorrectly
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Before posting logs, please scrub API keys, absolute paths containing
        your username, and anything from a real conversation.

        For security issues do **not** use this form — see
        [SECURITY.md](https://github.com/Abhinav210310453045/YUYUTSAVA-backend/blob/main/SECURITY.md).

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you ran, what happened, and what you expected instead.
      placeholder: |
        Ran: yuyutsava --verbose "..."
        Expected: ...
        Got: ...
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: The smallest set of steps that reliably triggers it.
    validations:
      required: true

  - type: dropdown
    id: mode
    attributes:
      label: Mode
      options:
        - CLI (one-shot)
        - CLI (chat REPL)
        - Daemon
        - Desktop app
        - Voice
        - Not sure
    validations:
      required: true

  - type: input
    id: provider
    attributes:
      label: LLM provider and model
      description: The value of LLM_PROVIDER, and the model.
      placeholder: "groq / llama-3.3-70b-versatile"
    validations:
      required: true

  - type: dropdown
    id: storage
    attributes:
      label: Storage backend
      options:
        - SQLite (default)
        - PostgreSQL
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: OS and version
      placeholder: "macOS 15.3 / Windows 11 / Ubuntu 24.04"
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Output of `git rev-parse --short HEAD`, or the release tag.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant output
      description: From `--verbose`. Scrubbed.
      render: shell

# YUYUTSAVA primary store: Postgres 16 + pgvector.
#
# Backs LangGraph checkpoints and the context-controller tables
# (artifacts, thread_summaries, memories). SQLite stays the zero-config
# fallback — this container is only needed when
# YUYUTSAVA_STORAGE_BACKEND=postgres.
#
# First run:
#   docker compose -f docker-compose.postgres.yml up -d
#   export YUYUTSAVA_STORAGE_BACKEND=postgres
#   # default DSN already matches: postgresql://yuyutsava:yuyutsava@127.0.0.1:5433/yuyutsava
#
# Host port 5433 (not 5432) so a system Postgres install never clashes.
#
# To stop:   docker compose -f docker-compose.postgres.yml down
# To wipe:   docker compose -f docker-compose.postgres.yml down -v

services:
  yuyutsava-db:
    image: pgvector/pgvector:pg16
    container_name: yuyutsava-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: yuyutsava
      POSTGRES_PASSWORD: yuyutsava
      POSTGRES_DB: yuyutsava
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - yuyutsava_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yuyutsava -d yuyutsava"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  yuyutsava_pg_data:
